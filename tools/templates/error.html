<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lỗi kết nối — DB Viewer</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border: 1px solid #fecaca; border-radius: 16px; padding: 36px 40px; max-width: 620px; box-shadow: 0 10px 40px -12px rgba(0,0,0,0.15); }
    .ico { font-size: 40px; margin-bottom: 12px; }
    h1 { color: #dc2626; font-size: 20px; margin: 0 0 12px; }
    p { color: #475569; font-size: 14px; margin: 6px 0; }
    pre { background: #0f172a; color: #fca5a5; padding: 16px; border-radius: 10px; overflow: auto; font-size: 12.5px; margin: 16px 0; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 5px; font-size: 12.5px; }
    ul { color: #475569; font-size: 13.5px; padding-left: 20px; line-height: 1.9; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">⚠️</div>
    <h1>Không kết nối được CSDL</h1>
    <p>Server: <code>{{ server }}</code> — Database: <code>{{ db }}</code></p>
    <pre>{{ error }}</pre>
    <p><b>Kiểm tra:</b></p>
    <ul>
      <li>SQL Server / LocalDB đang chạy chưa?</li>
      <li>Tên database đúng chưa? (mặc định: QUANLYNHANSU)</li>
      <li>Driver <code>ODBC Driver 17 for SQL Server</code> đã cài chưa?</li>
      <li>Đã chạy file <code>QUANLYNHANSU.sql</code> để tạo DB chưa?</li>
    </ul>
  </div>
</body>
</html>
